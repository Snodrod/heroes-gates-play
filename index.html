		<style>
html, body {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: #1d1a24;
	touch-action: none;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

body {
	color: white;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<!-- Телеграм: SDK грузим ДО движка (TASK п.1). Вне Телеграма скрипт либо не
		     загрузится (нет сети до telegram.org), либо window.Telegram.WebApp окажется
		     с пустым initData — в обоих случаях следующий блок ничего телеграмного не делает
		     и не бросает ошибок. -->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script>
(function () {
	'use strict';

	var tg = null;
	try {
		if (window.Telegram && window.Telegram.WebApp) {
			tg = window.Telegram.WebApp;
		}
	} catch (e) {
		tg = null;
	}
	var inTelegram = !!(tg && tg.initData);

	// Единая точка данных для игры (game/ читает через JavaScriptBridge, см. agents/ui.md).
	window.hgTelegram = {
		inTelegram: inTelegram,
		lang: 'en',
		platform: 'web',
		insets: { top: 0, bottom: 0, left: 0, right: 0 }
	};

	try {
		if (inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) {
			window.hgTelegram.lang = String(tg.initDataUnsafe.user.language_code).slice(0, 2);
		} else if (navigator.language) {
			window.hgTelegram.lang = navigator.language.slice(0, 2);
		}
	} catch (e) { /* оставляем 'en' по умолчанию */ }

	if (inTelegram) {
		try { window.hgTelegram.platform = tg.platform || 'web'; } catch (e) {}
	}

	function hasVersion(v) {
		try {
			return !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v));
		} catch (e) {
			return false;
		}
	}

	function updateInsets() {
		if (!inTelegram) { return; }
		try {
			var a = tg.safeAreaInset || {};
			var b = tg.contentSafeAreaInset || {};
			window.hgTelegram.insets = {
				top: Math.max(a.top || 0, b.top || 0),
				bottom: Math.max(a.bottom || 0, b.bottom || 0),
				left: Math.max(a.left || 0, b.left || 0),
				right: Math.max(a.right || 0, b.right || 0)
			};
		} catch (e) { /* нет данных safe area — оставляем нули */ }
	}

	if (inTelegram) {
		try { tg.ready(); } catch (e) {}
		try { tg.expand(); } catch (e) {}
		if (hasVersion('8.0')) {
			try {
				if (!tg.isFullscreen) { tg.requestFullscreen(); }
			} catch (e) {}
			// Портрет теперь поддерживаемый режим (docs/TOWN_AND_ARMY.md §5): ориентацию
			// не закрепляем ни в портрете, ни в ландшафте; снимаем возможный замок,
			// оставшийся от настроек бота или прошлой сессии. lockOrientation() не вызываем.
			try { tg.unlockOrientation(); } catch (e) { /* не все клиенты поддерживают вызов */ }
		}
		// Критично: вертикальный свайп не должен сворачивать игру посреди боя.
		try { tg.disableVerticalSwipes(); } catch (e) {}
		try { tg.setHeaderColor('#1d1a24'); } catch (e) {}
		try { tg.setBackgroundColor('#1d1a24'); } catch (e) {}

		updateInsets();
		try {
			tg.onEvent('safeAreaChanged', updateInsets);
			tg.onEvent('contentSafeAreaChanged', updateInsets);
			tg.onEvent('fullscreenChanged', updateInsets);
			tg.onEvent('viewportChanged', updateInsets);
		} catch (e) {}
	}

	// Часть мобильных WebView не шлёт resize при повороте — досылаем сами, чтобы
	// адаптивный канвас Godot (html/canvas_resize_policy=2) пересчитал размер и в
	// портрете, и в ландшафте (оверлей "поверните телефон" убран — TASK, §5 спеки).
	window.addEventListener('orientationchange', function () {
		setTimeout(function () {
			try { window.dispatchEvent(new Event('resize')); } catch (e) {}
		}, 60);
	});
}());
		</script>

		<!-- BUG "звук не работает" (Telegram iOS, WebView): физический переключатель звонка
		     в положении "без звука" глушит Web Audio, а AudioContext, который создаёт Godot,
		     стартует в состоянии suspended до первого жеста пользователя. Хук ставим ДО
		     загрузки движка (index.js ниже), чтобы поймать AudioContext(ы) в момент их
		     создания движком при старте. Вне iOS/Telegram и на десктопе блок не меняет
		     поведение: resume() на уже запущенном контексте — no-op, беззвучный <audio> с
		     громкостью ~0.01 никому не мешает. -->
		<script>
(function () {
	'use strict';

	var capturedContexts = [];

	function hookCtor(name) {
		var Original = window[name];
		if (typeof Original !== 'function') { return; }
		try {
			window[name] = new Proxy(Original, {
				construct: function (Target, args) {
					var instance = new Target(...args);
					capturedContexts.push(instance);
					return instance;
				}
			});
		} catch (e) { /* нет Proxy (древний браузер) — просто не хукаем */ }
	}

	hookCtor('AudioContext');
	hookCtor('webkitAudioContext');

	function resumeAll() {
		capturedContexts.forEach(function (ctx) {
			try {
				if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
					ctx.resume();
				}
			} catch (e) {}
		});
	}

	// Стандартный iOS-приём "unlock": короткий беззвучный зацикленный <audio> переключает
	// аудио-сессию Safari/WKWebView в режим воспроизведения, из-за чего Web Audio становится
	// слышен даже при переключателе "без звука". Сам файл — минимальный валидный WAV (0.1 c
	// тишины, 8 кГц/8 бит/моно), сгенерирован локально, никуда не грузится по сети.
	var SILENT_WAV = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';

	var unlockAudio = new Audio(SILENT_WAV);
	unlockAudio.loop = true;
	unlockAudio.volume = 0.01;
	try { unlockAudio.playsInline = true; } catch (e) {}
	unlockAudio.setAttribute('playsinline', '');
	unlockAudio.setAttribute('webkit-playsinline', '');

	var unlocked = false;
	function unlockOnGesture() {
		if (unlocked) { return; }
		unlocked = true;
		try {
			var p = unlockAudio.play();
			if (p && typeof p.catch === 'function') { p.catch(function () {}); }
		} catch (e) {}
		resumeAll();
	}

	['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(function (type) {
		window.addEventListener(type, unlockOnGesture, { capture: true, passive: true, once: true });
	});

	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') {
			resumeAll();
		}
	});

	// Только для диагностики (проверка через javascript_tool/консоль), поведения не меняет.
	window.hgAudioUnlock = { contexts: capturedContexts, resumeAll: resumeAll };
}());
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":23410192,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
