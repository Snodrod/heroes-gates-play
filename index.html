<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#1d1a24">
		<title>Врата Героев</title>
		<style>
html, body {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: #1d1a24;
	touch-action: pinch-zoom;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

#portrait-gate {
	position: fixed;
	inset: 0;
	z-index: 40;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 20px;
	padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
		max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
	box-sizing: border-box;
	background: #121922;
	color: #ffe8af;
	text-align: center;
	font: 22px Georgia, serif;
}
#portrait-gate[hidden] { display: none; }
#portrait-gate:focus { outline: none; }
#portrait-gate-icon {
	width: 44px;
	height: 74px;
	border: 3px solid #cda754;
	border-radius: 9px;
	box-shadow: 0 0 24px #cda75433;
}
#portrait-gate p { margin: 0; max-width: 460px; }

body {
	color: white;
}

#status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	--hg-loader-safe-top: env(safe-area-inset-top, 0px);
	--hg-loader-safe-right: env(safe-area-inset-right, 0px);
	--hg-loader-safe-bottom: env(safe-area-inset-bottom, 0px);
	--hg-loader-safe-left: env(safe-area-inset-left, 0px);
	position: fixed;
	inset: 0;
	z-index: 20;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: var(--hg-loader-safe-top) var(--hg-loader-safe-right)
		var(--hg-loader-safe-bottom) var(--hg-loader-safe-left);
	box-sizing: border-box;
	background: #121922;
}

#status-splash {
	top: 0;
	bottom: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
}
#status-title, #status-caption {
	position: absolute;
	z-index: 1;
	text-align: center;
	color: #ffe8af;
	text-shadow: 0 2px 5px #101522, 0 0 16px #101522;
	margin: 0;
	left: max(16px, var(--hg-loader-safe-left));
	right: max(16px, var(--hg-loader-safe-right));
}
#status-title {
	top: calc(var(--hg-loader-safe-top) + 4vh);
	font: bold clamp(24px, 5vw, 46px) Georgia, serif;
}
#status-caption {
	bottom: calc(var(--hg-loader-safe-bottom) + 21%);
	font: 18px Georgia, serif;
}
@media (orientation: landscape) {
	#status-splash { object-fit: contain; background: #121922; }
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: calc(var(--hg-loader-safe-bottom) + 15%);
	left: var(--hg-loader-safe-left);
	right: var(--hg-loader-safe-right);
	width: min(70%, 500px, calc(100% - var(--hg-loader-safe-left) - var(--hg-loader-safe-right) - 32px));
	height: 16px;
	accent-color: #cda754;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<div id="portrait-gate" role="status" aria-live="polite" aria-atomic="true"
			aria-hidden="true" tabindex="-1" hidden>
			<span id="portrait-gate-icon" aria-hidden="true"></span>
			<p id="portrait-gate-text">Turn your phone upright to continue.</p>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="city-order-e1110e0.png" alt="">
			<h1 id="status-title">Врата Героев</h1>
			<p id="status-caption">Открываем врата…</p>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<!-- Телеграм: SDK грузим ДО движка (TASK п.1). Вне Телеграма скрипт либо не
		     загрузится (нет сети до telegram.org), либо window.Telegram.WebApp окажется
		     с пустым initData — в обоих случаях следующий блок ничего телеграмного не делает
		     и не бросает ошибок. -->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script>
(function () {
	'use strict';

	var tg = null;
	try {
		if (window.Telegram && window.Telegram.WebApp) {
			tg = window.Telegram.WebApp;
		}
	} catch (e) {
		tg = null;
	}
	var inTelegram = !!(tg && tg.initData);

	// Единая точка данных для игры (game/ читает через JavaScriptBridge, см. agents/ui.md).
	window.hgTelegram = {
		inTelegram: inTelegram,
		lang: 'en',
		platform: 'web',
		portraitBlocked: false,
		insets: { top: 0, bottom: 0, left: 0, right: 0 }
	};

	try {
		if (inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) {
			window.hgTelegram.lang = String(tg.initDataUnsafe.user.language_code).slice(0, 2);
		} else if (navigator.language) {
			window.hgTelegram.lang = navigator.language.slice(0, 2);
		}
	} catch (e) { /* оставляем 'en' по умолчанию */ }

	if (inTelegram) {
		try { window.hgTelegram.platform = tg.platform || 'web'; } catch (e) {}
	}

	// Вызов на бой по ссылке (sim/meta/hg_challenge.gd): start_param из Telegram
	// (startapp=duel_...), запасной вход — ?duel=... или ?tgWebAppStartParam=... в адресе.
	window.hgTelegram.startParam = '';
	window.hgTelegram.userName = '';
	try {
		var usp = new URLSearchParams(window.location.search);
		var sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || usp.get('tgWebAppStartParam') || '';
		if (!sp && usp.get('duel')) { sp = 'duel_' + usp.get('duel'); }
		window.hgTelegram.startParam = String(sp).slice(0, 128);
		var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
		if (u) { window.hgTelegram.userName = String(u.first_name || u.username || '').slice(0, 40); }
	} catch (e) {}
	// Оплата (monetization.md §7). initData — сырая подписанная строка для POST /auth/telegram
	// (сервер проверяет подпись; initDataUnsafe для входа не годится), вне Telegram — ''.
	// hgOpenInvoice(url) открывает окно счёта Telegram Stars и кладёт итог окна в
	// window.hgLastInvoice = {url, status}: status '' пока окно открыто, затем paid /
	// cancelled / failed / pending от SDK. game/platform/hg_platform.gd опрашивает его раз в
	// 250 мс; «paid» — только сигнал, права подтверждает сервер (GET /billing/invoices/:id).
	window.hgTelegram.initData = '';
	try { if (inTelegram) { window.hgTelegram.initData = String(tg.initData || ''); } } catch (e) {}
	window.hgLastInvoice = null;
	window.hgOpenInvoice = function (url) {
		var link = String(url || '');
		window.hgLastInvoice = { url: link, status: '' };
		try {
			if (!inTelegram || typeof tg.openInvoice !== 'function' || !link) {
				window.hgLastInvoice.status = 'failed';
				return 'none';
			}
			tg.openInvoice(link, function (status) {
				window.hgLastInvoice = { url: link, status: String(status || 'failed') };
			});
			return 'telegram';
		} catch (e) {
			window.hgLastInvoice = { url: link, status: 'failed' };
			return 'error';
		}
	};
	// Отправить ссылку-вызов: окно «Поделиться» Telegram, вне Telegram — системное меню или буфер.
	window.hgShareLink = function (url, text) {
		var share = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
		try { if (tg && tg.openTelegramLink && inTelegram) { tg.openTelegramLink(share); return 'telegram'; } } catch (e) {}
		try { if (navigator.share) { navigator.share({ url: url, text: text }); return 'native'; } } catch (e) {}
		try { if (navigator.clipboard) { navigator.clipboard.writeText(text + ' ' + url); return 'clipboard'; } } catch (e) {}
		try { window.open(share, '_blank'); return 'window'; } catch (e) {}
		return 'none';
	};

	function hasVersion(v) {
		try {
			return !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v));
		} catch (e) {
			return false;
		}
	}

	function pixels(value) {
		var n = Number(value);
		return Number.isFinite(n) && n > 0 ? n : 0;
	}

	// The game uses a portrait viewport on every device. Desktop letterboxing is
	// done by Godot's KEEP aspect; keep the full CSS canvas and its DPR mapping.
	var mobileClient = /^(ios|android)$/.test(window.hgTelegram.platform);
	try {
		mobileClient = mobileClient || !!(navigator.userAgentData && navigator.userAgentData.mobile) ||
			/Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
			(/Macintosh/i.test(navigator.userAgent || '') && navigator.maxTouchPoints > 1);
	} catch (e) {}
	var portraitGate = document.getElementById('portrait-gate');
	var portraitText = document.getElementById('portrait-gate-text');
	var portraitLanguage = window.hgTelegram.lang;
	var previousFocus = null;
	var orientationMode = '';

	window.hgSetPortraitLanguage = function (lang) {
		portraitLanguage = String(lang || 'en');
		if (portraitText) {
			portraitText.textContent = portraitLanguage.slice(0, 2) === 'ru' ?
				'Поверните телефон вертикально, чтобы продолжить.' : 'Turn your phone upright to continue.';
		}
	};
	window.hgSetPortraitLanguage(portraitLanguage);

	function updatePortraitPolicy() {
		var width = pixels(window.innerWidth);
		var height = pixels(window.innerHeight);
		var blocked = mobileClient && width > 0 && height > 0 && width > height;
		var changed = window.hgTelegram.portraitBlocked !== blocked;
		window.hgTelegram.portraitBlocked = blocked;
		var canvas = document.getElementById('canvas');
		if (portraitGate) {
			portraitGate.hidden = !blocked;
			portraitGate.setAttribute('aria-hidden', String(!blocked));
		}
		if (canvas) {
			canvas.inert = blocked;
			canvas.style.pointerEvents = blocked ? 'none' : '';
			if (blocked) { canvas.setAttribute('aria-hidden', 'true'); }
			else { canvas.removeAttribute('aria-hidden'); }
		}
		if (changed) {
			if (blocked) {
				previousFocus = document.activeElement;
				if (portraitGate) { portraitGate.focus({ preventScroll: true }); }
			} else if (previousFocus && typeof previousFocus.focus === 'function') {
				previousFocus.focus({ preventScroll: true });
				previousFocus = null;
			}
			// HGPlatform reads the flag on startup too, so a landscape launch before
			// JavaScriptBridge exists is paused as soon as the game registers.
			if (typeof window.hgPortraitBlocked === 'function') {
				try { window.hgPortraitBlocked(blocked); } catch (e) {}
			}
			try { window.dispatchEvent(new CustomEvent('hg:portrait-blocked', { detail: blocked })); } catch (e) {}
		}
		var mode = mobileClient ? (blocked ? 'landscape' : 'portrait') : 'desktop';
		if (mode === orientationMode) { return; }
		orientationMode = mode;
		if (!mobileClient) { return; }
		if (inTelegram && hasVersion('8.0')) {
			// Telegram locks the CURRENT orientation, not a requested direction:
			// never trap a landscape launch. Lock after the player turns upright.
			try {
				if (blocked) { if (tg.isOrientationLocked) { tg.unlockOrientation(); } }
				else { tg.lockOrientation(); }
			} catch (e) {}
		}
		try {
			var orientation = window.screen && window.screen.orientation;
			if (orientation && typeof orientation.lock === 'function') {
				var lockRequest = orientation.lock('portrait');
				if (lockRequest && typeof lockRequest.catch === 'function') { lockRequest.catch(function () {}); }
			}
		} catch (e) { /* unsupported / fullscreen required: the rotate gate remains usable */ }
	}

	// Telegram-iOS places fullscreen controls below the status bar. The content
	// inset excludes that bar: add system + content, rather than taking their max.
	// CSS env is a fallback for the system notch only, not Telegram controls.
	var safeProbe = document.createElement('div');
	safeProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
		'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) ' +
		'env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);';
	if (inTelegram) { document.body.appendChild(safeProbe); }
	var lastSignature = '';
	var snapshotPending = false;

	function updateSnapshot() {
		updatePortraitPolicy();
		var canvas = document.getElementById('canvas');
		var snapshot = window.hgTelegram;
		snapshot.canvasCssWidth = canvas ? pixels(canvas.clientWidth) : 0;
		snapshot.canvasCssHeight = canvas ? pixels(canvas.clientHeight) : 0;
		snapshot.viewportHeight = inTelegram ? pixels(tg.viewportHeight) : pixels(window.innerHeight);
		snapshot.viewportStableHeight = inTelegram ? pixels(tg.viewportStableHeight) : pixels(window.innerHeight);
		snapshot.isFullscreen = !!(inTelegram && tg.isFullscreen);
		if (inTelegram) {
			try {
				var system = tg.safeAreaInset || {};
				var content = tg.contentSafeAreaInset || {};
				var css = window.getComputedStyle(safeProbe);
				var insets = {};
				['top', 'right', 'bottom', 'left'].forEach(function (side) {
					var envInset = pixels(parseFloat(css.getPropertyValue('padding-' + side)));
					insets[side] = Math.max(pixels(system[side]), envInset) + pixels(content[side]);
				});
				snapshot.insets = insets;
			} catch (e) { /* retain the previous valid insets */ }
		}
		// The HTML city loader precedes Godot: reserve the same Telegram controls
		// immediately, then refresh them on SDK/viewport changes while it is visible.
		// Ordinary browsers retain the CSS env fallback; the city image stays full-bleed.
		var loader = document.getElementById('status');
		if (inTelegram && loader) {
			['top', 'right', 'bottom', 'left'].forEach(function (side) {
				loader.style.setProperty('--hg-loader-safe-' + side, pixels(snapshot.insets[side]) + 'px');
			});
		}
		// Godot knows its logical viewport; expose CSS dimensions, not framebuffer/DPR.
		var signature = JSON.stringify(snapshot);
		if (signature !== lastSignature) {
			lastSignature = signature;
			if (typeof window.hgPlatformInsets === 'function') {
				try { window.hgPlatformInsets(); } catch (e) {}
			}
		}
	}

	function scheduleSnapshot() {
		if (snapshotPending) { return; }
		snapshotPending = true;
		window.requestAnimationFrame(function () {
			snapshotPending = false;
			updateSnapshot();
		});
	}

	function telegramViewportChanged() {
		updateSnapshot();
		// SDK changes may not raise WebView resize; notify Godot's window policy.
		try { window.dispatchEvent(new Event('resize')); } catch (e) {}
		scheduleSnapshot();
	}

	if (inTelegram) {
		['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged'].forEach(function (eventName) {
			try { tg.onEvent(eventName, telegramViewportChanged); } catch (e) {}
		});
		try { tg.ready(); } catch (e) {}
		try { tg.expand(); } catch (e) {}
		if (hasVersion('8.0')) {
			try {
				if (!tg.isFullscreen) { tg.requestFullscreen(); }
			} catch (e) {}
		}
		// Критично: вертикальный свайп не должен сворачивать игру посреди боя.
		try { tg.disableVerticalSwipes(); } catch (e) {}
		try { tg.setHeaderColor('#1d1a24'); } catch (e) {}
		try { tg.setBackgroundColor('#1d1a24'); } catch (e) {}

	}

	// Some WebViews omit resize after rotation: refresh both portrait gate and
	// safe-area/CSS metrics while the phone settles, then resume the same game.
	window.addEventListener('resize', scheduleSnapshot);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', scheduleSnapshot);
	}
	if (typeof ResizeObserver === 'function') {
		var canvasObserver = new ResizeObserver(scheduleSnapshot);
		var observedCanvas = document.getElementById('canvas');
		if (observedCanvas) { canvasObserver.observe(observedCanvas); }
	}
	// Recover a resize missed during Telegram expand/fullscreen. Godot 4.5.1's
	// full-window policy uses floor(innerSize * DPR), then floors the CSS size
	// separately. clientSize * DPR differs at fractional page zoom, so comparing
	// against it can repeatedly "repair" an already-correct engine framebuffer.
	// Browser pinch only changes visualViewport: retain the layout viewport canvas
	// and let Godot map client coordinates through its actual bounding rectangle.
	function canvasOutOfSync() {
		var c = document.getElementById('canvas');
		var width = pixels(window.innerWidth);
		var height = pixels(window.innerHeight);
		if (!c || !width || !height) { return false; }
		var dpr = pixels(window.devicePixelRatio) || 1;
		var bufferWidth = Math.floor(width * dpr);
		var bufferHeight = Math.floor(height * dpr);
		return c.width !== bufferWidth || c.height !== bufferHeight ||
			c.clientWidth !== Math.floor(bufferWidth / dpr) || c.clientHeight !== Math.floor(bufferHeight / dpr);
	}
	function nudgeResize() {
		try { window.dispatchEvent(new Event('resize')); } catch (e) {}
		scheduleSnapshot();
	}
	// The engine checks DPR, CSS size AND framebuffer size itself. A notification
	// is enough; changing CSS here creates a second layout while zoom is settling.
	window.hgCanvasResync = function () {
		[0, 100].forEach(function (delay) { setTimeout(nudgeResize, delay); });
		[400, 1500, 4000].forEach(function (delay) { setTimeout(function () { if (canvasOutOfSync()) { nudgeResize(); } }, delay); });
	};
	setInterval(function () { if (canvasOutOfSync()) { nudgeResize(); } }, 700);
	document.addEventListener('visibilitychange', function () { if (!document.hidden) { window.hgCanvasResync(); } });
	window.addEventListener('focus', function () { window.hgCanvasResync(); });
	window.addEventListener('orientationchange', function () {
		// iOS metrics can settle after the initial orientation event.
		[60, 250].forEach(function (delay) { setTimeout(telegramViewportChanged, delay); });
	});
	// Native text field (game/platform/hg_native_text.gd). Godot's own web IME takes text
	// only on compositionend from a hidden div, and with experimental_virtual_keyboard off a
	// phone in Telegram may show no keyboard at all. On a touch device the game arms each
	// visible LineEdit with its rect (framebuffer px of the canvas); a tap inside an armed rect
	// shows a real <input> over the field IN the gesture (iOS opens the keyboard only from a
	// user gesture), with native keyboard, IME and paste. Enter or blur hands the value back
	// to the game through the field's sink: sink(kind, value), kind 'input' | 'submit' | 'blur'.
	var nativeFields = {};
	var nativeSinks = {};
	var nativeCurrent = null;
	var nativeBox = null;
	var nativeKeep = false;

	function nativeTouch() {
		try {
			return !!(mobileClient || navigator.maxTouchPoints > 0 || ('ontouchstart' in window));
		} catch (e) {
			return false;
		}
	}

	function nativeCanvasRect() {
		var canvas = document.getElementById('canvas');
		if (!canvas) { return null; }
		var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() :
			{ left: 0, top: 0, width: canvas.clientWidth, height: canvas.clientHeight };
		var k = canvas.width > 0 ? pixels(r.width) / canvas.width : 1;
		return { left: Number(r.left) || 0, top: Number(r.top) || 0, k: k || 1 };
	}

	// CSS rect of a field spec {x, y, w, h, font} given in framebuffer px.
	function nativeCss(spec) {
		var c = nativeCanvasRect() || { left: 0, top: 0, k: 1 };
		return {
			left: c.left + Number(spec.x || 0) * c.k,
			top: c.top + Number(spec.y || 0) * c.k,
			width: Number(spec.w || 0) * c.k,
			height: Number(spec.h || 0) * c.k,
			// 16 CSS px at least: iOS zooms the page into a smaller field.
			font: Math.max(16, Number(spec.font || 0) * c.k)
		};
	}

	function nativePlace(spec) {
		if (!nativeBox) { return; }
		var css = nativeCss(spec);
		nativeBox.style.left = css.left + 'px';
		nativeBox.style.top = css.top + 'px';
		nativeBox.style.width = css.width + 'px';
		nativeBox.style.height = css.height + 'px';
		nativeBox.style.fontSize = css.font + 'px';
	}

	function nativeSend(id, kind, value) {
		window.hgNativeInputLast = { id: id, kind: kind, value: value };
		var sink = nativeSinks[id];
		if (typeof sink === 'function') {
			try { sink(kind, value); } catch (e) {}
		}
	}

	function nativeValue(spec) {
		var value = String(nativeBox ? nativeBox.value : '').replace(/[\r\n]+/g, ' ');
		var max = Number(spec.maxLength || 0);
		return max > 0 ? Array.from(value).slice(0, max).join('') : value;
	}

	function nativeCommit(kind) {
		var spec = nativeCurrent;
		if (!spec || nativeKeep) { return; }
		nativeCurrent = null;
		var value = nativeValue(spec);
		nativeBox.style.display = 'none';
		if (kind === 'submit') {
			try { nativeBox.blur(); } catch (e) {}
			var canvas = document.getElementById('canvas');
			try { if (canvas && canvas.focus) { canvas.focus({ preventScroll: true }); } } catch (e) {}
		}
		nativeSend(spec.id, kind, value);
	}

	function nativeEnsureBox() {
		if (nativeBox) { return nativeBox; }
		var box = document.createElement('input');
		box.id = 'hg-native-input';
		box.type = 'text';
		box.setAttribute('autocomplete', 'off');
		box.setAttribute('autocorrect', 'off');
		box.setAttribute('autocapitalize', 'words');
		box.setAttribute('spellcheck', 'false');
		box.setAttribute('enterkeyhint', 'done');
