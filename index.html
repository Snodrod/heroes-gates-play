<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#1d1a24">
		<title>Врата Героев</title>
		<style>
html, body {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: #1d1a24;
	touch-action: none;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

body {
	color: white;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Оверлей поворота экрана (Телеграм-шелл, agents/tests.md, TASK п.2) — игра ландшафтная,
   в портрете накрываем канвас поверх, в ландшафте прячем. Живёт в шелле, не в Godot. */
#hg-rotate-overlay {
	position: fixed;
	inset: 0;
	z-index: 9999;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.5rem;
	background-color: #1d1a24;
	color: #f2ece0;
	font-family: 'Noto Sans', 'Droid Sans', 'Segoe UI', Arial, sans-serif;
	text-align: center;
	box-sizing: border-box;
	padding: max(2rem, env(safe-area-inset-top)) max(2rem, env(safe-area-inset-right))
		max(2rem, env(safe-area-inset-bottom)) max(2rem, env(safe-area-inset-left));
}

#hg-rotate-overlay.hg-visible {
	display: flex;
}

#hg-rotate-overlay svg {
	width: 88px;
	height: 88px;
	flex-shrink: 0;
	animation: hg-rotate-hint 1.6s ease-in-out infinite;
}

@keyframes hg-rotate-hint {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(90deg); }
}

#hg-rotate-overlay p {
	margin: 0;
	max-width: min(26rem, 100%);
	overflow-wrap: anywhere;
	font-size: 1.1rem;
	line-height: 1.5;
}

#hg-rotate-overlay p.hg-lang-en {
	opacity: 0.7;
	font-size: 0.95rem;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="hg-rotate-overlay">
			<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#f2ece0" stroke-width="3">
				<rect x="18" y="6" width="28" height="52" rx="5" />
				<line x1="18" y1="46" x2="46" y2="46" />
				<circle cx="32" cy="52" r="1.6" fill="#f2ece0" stroke="none" />
			</svg>
			<p lang="ru">Поверните телефон горизонтально</p>
			<p class="hg-lang-en" lang="en">Rotate your phone to landscape</p>
		</div>

		<!-- Телеграм: SDK грузим ДО движка (TASK п.1). Вне Телеграма скрипт либо не
		     загрузится (нет сети до telegram.org), либо window.Telegram.WebApp окажется
		     с пустым initData — в обоих случаях следующий блок ничего телеграмного не делает
		     и не бросает ошибок. -->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script>
(function () {
	'use strict';

	var overlay = document.getElementById('hg-rotate-overlay');
	var tg = null;
	try {
		if (window.Telegram && window.Telegram.WebApp) {
			tg = window.Telegram.WebApp;
		}
	} catch (e) {
		tg = null;
	}
	var inTelegram = !!(tg && tg.initData);

	// Единая точка данных для игры (game/ читает через JavaScriptBridge, см. agents/ui.md).
	window.hgTelegram = {
		inTelegram: inTelegram,
		lang: 'en',
		platform: 'web',
		insets: { top: 0, bottom: 0, left: 0, right: 0 }
	};

	try {
		if (inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) {
			window.hgTelegram.lang = String(tg.initDataUnsafe.user.language_code).slice(0, 2);
		} else if (navigator.language) {
			window.hgTelegram.lang = navigator.language.slice(0, 2);
		}
	} catch (e) { /* оставляем 'en' по умолчанию */ }

	if (inTelegram) {
		try { window.hgTelegram.platform = tg.platform || 'web'; } catch (e) {}
	}

	function hasVersion(v) {
		try {
			return !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v));
		} catch (e) {
			return false;
		}
	}

	function updateInsets() {
		if (!inTelegram) { return; }
		try {
			var a = tg.safeAreaInset || {};
			var b = tg.contentSafeAreaInset || {};
			window.hgTelegram.insets = {
				top: Math.max(a.top || 0, b.top || 0),
				bottom: Math.max(a.bottom || 0, b.bottom || 0),
				left: Math.max(a.left || 0, b.left || 0),
				right: Math.max(a.right || 0, b.right || 0)
			};
		} catch (e) { /* нет данных safe area — оставляем нули */ }
	}

	function updateOrientation() {
		var portrait = window.innerHeight > window.innerWidth;
		if (overlay) {
			overlay.classList.toggle('hg-visible', portrait);
		}
		if (inTelegram && hasVersion('8.0')) {
			try {
				if (portrait) {
					tg.unlockOrientation();
				} else {
					tg.lockOrientation();
				}
			} catch (e) { /* не все клиенты поддерживают блокировку ориентации */ }
		}
	}

	if (inTelegram) {
		try { tg.ready(); } catch (e) {}
		try { tg.expand(); } catch (e) {}
		if (hasVersion('8.0')) {
			try {
				if (!tg.isFullscreen) { tg.requestFullscreen(); }
			} catch (e) {}
		}
		// Критично: вертикальный свайп не должен сворачивать игру посреди боя.
		try { tg.disableVerticalSwipes(); } catch (e) {}
		try { tg.setHeaderColor('#1d1a24'); } catch (e) {}
		try { tg.setBackgroundColor('#1d1a24'); } catch (e) {}

		updateInsets();
		try {
			tg.onEvent('safeAreaChanged', updateInsets);
			tg.onEvent('contentSafeAreaChanged', updateInsets);
			tg.onEvent('fullscreenChanged', updateInsets);
			tg.onEvent('viewportChanged', updateInsets);
		} catch (e) {}
	}

	updateOrientation();
	window.addEventListener('resize', updateOrientation);
	// Часть мобильных WebView не шлёт resize при повороте — досылаем сами, чтобы
	// адаптивный канвас Godot (html/canvas_resize_policy=2) пересчитал размер. Дозвон
	// делаем только отсюда (не из updateOrientation), иначе resize-слушатель уйдёт в
	// бесконечную рекурсию сам с собой.
	window.addEventListener('orientationchange', function () {
		setTimeout(function () {
			updateOrientation();
			try { window.dispatchEvent(new Event('resize')); } catch (e) {}
		}, 60);
	});
}());
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":23284160,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
